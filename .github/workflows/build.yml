name: Build & Test Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Test Python Converter Script
        run: |
          python tools/rbxl_convert.py test/sample_place.rbxlx test/sample_place.r3d

      - name: Build Firmware
        run: |
          pio run
